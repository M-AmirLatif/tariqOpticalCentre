<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082025"/>
      <stop offset="100%" stop-color="#0E333B"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B272E"/>
      <stop offset="100%" stop-color="#051417"/>
    </linearGradient>
    <linearGradient id="brassSign" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFAD53"/>
      <stop offset="50%" stop-color="#F5D28A"/>
      <stop offset="100%" stop-color="#C8963E"/>
    </linearGradient>
    <linearGradient id="spotlightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2BB5B0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2BB5B0" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect x="0" y="0" width="800" height="340" fill="url(#wallGrad)"/>

  <!-- Floor -->
  <rect x="0" y="340" width="800" height="160" fill="url(#floorGrad)"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#C8963E" stroke-width="2" opacity="0.6"/>

  <!-- Vertical Boutique Wood Slats -->
  <g stroke="#0F3C45" stroke-width="3" opacity="0.4">
    <line x1="60" y1="0" x2="60" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="180" y1="0" x2="180" y2="340"/>
    <line x1="620" y1="0" x2="620" y2="340"/>
    <line x1="680" y1="0" x2="680" y2="340"/>
    <line x1="740" y1="0" x2="740" y2="340"/>
  </g>

  <!-- Ceiling Spotlights -->
  <rect x="0" y="0" width="800" height="25" fill="#040F12"/>
  <ellipse cx="200" cy="25" rx="30" ry="10" fill="#FFF2C6"/>
  <polygon points="175,25 225,25 290,260 110,260" fill="url(#spotlightCone)"/>
  
  <ellipse cx="600" cy="25" rx="30" ry="10" fill="#FFF2C6"/>
  <polygon points="575,25 625,25 690,260 510,260" fill="url(#spotlightCone)"/>

  <!-- Main Signboard Header -->
  <rect x="140" y="35" width="520" height="70" rx="14" fill="#071D22" stroke="url(#brassSign)" stroke-width="2.5" filter="url(#softGlow)"/>
  <text x="400" y="65" font-family="'Noto Nastaliq Urdu', serif" font-size="22" font-weight="bold" fill="#FCE5AC" text-anchor="middle">طارق آپٹیکل سنٹر قصور</text>
  <text x="400" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="3" font-weight="600" fill="#3BD4CF" text-anchor="middle">TARIQ OPTICAL CENTRE • NIAZ BAZAR</text>

  <!-- Left Showcase: Optical Frames -->
  <rect x="50" y="125" width="180" height="235" rx="10" fill="#0A242A" stroke="#C8963E" stroke-width="1.8"/>
  <rect x="50" y="125" width="180" height="28" rx="8" fill="#143F48"/>
  <text x="140" y="144" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F5D28A" text-anchor="middle">OPTICAL FRAMES</text>

  <!-- Frame Shelves -->
  <line x1="60" y1="180" x2="220" y2="180" stroke="#C8963E" stroke-width="1.5"/>
  <line x1="60" y1="230" x2="220" y2="230" stroke="#C8963E" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="220" y2="280" stroke="#C8963E" stroke-width="1.5"/>
  <line x1="60" y1="330" x2="220" y2="330" stroke="#C8963E" stroke-width="1.5"/>

  <!-- Display Glasses Icons on Left Shelves -->
  <g stroke="#3BD4CF" stroke-width="2" fill="none">
    <!-- Row 1 -->
    <rect x="75" y="162" width="28" height="14" rx="4"/>
    <rect x="110" y="162" width="28" height="14" rx="4"/>
    <line x1="103" y1="168" x2="110" y2="168"/>

    <rect x="155" y="162" width="28" height="14" rx="7"/>
    <rect x="187" y="162" width="28" height="14" rx="7"/>
    <line x1="183" y1="168" x2="187" y2="168"/>

    <!-- Row 2 -->
    <rect x="75" y="212" width="28" height="14" rx="7"/>
    <rect x="107" y="212" width="28" height="14" rx="7"/>
    <line x1="103" y1="218" x2="107" y2="218"/>

    <rect x="155" y="212" width="28" height="14" rx="4"/>
    <rect x="187" y="212" width="28" height="14" rx="4"/>
    <line x1="183" y1="218" x2="187" y2="218"/>

    <!-- Row 3 -->
    <rect x="75" y="262" width="28" height="14" rx="4"/>
    <rect x="107" y="262" width="28" height="14" rx="4"/>
    <line x1="103" y1="268" x2="107" y2="268"/>

    <rect x="155" y="262" width="28" height="14" rx="6"/>
    <rect x="187" y="262" width="28" height="14" rx="6"/>
    <line x1="183" y1="268" x2="187" y2="268"/>
  </g>

  <!-- Right Showcase: Sunglasses & Accessories -->
  <rect x="570" y="125" width="180" height="235" rx="10" fill="#0A242A" stroke="#C8963E" stroke-width="1.8"/>
  <rect x="570" y="125" width="180" height="28" rx="8" fill="#143F48"/>
  <text x="660" y="144" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F5D28A" text-anchor="middle">SUN &amp; LENSES</text>

  <!-- Sun Shelves -->
  <line x1="580" y1="180" x2="740" y2="180" stroke="#C8963E" stroke-width="1.5"/>
  <line x1="580" y1="230" x2="740" y2="230" stroke="#C8963E" stroke-width="1.5"/>
  <line x1="580" y1="280" x2="740" y2="280" stroke="#C8963E" stroke-width="1.5"/>
  <line x1="580" y1="330" x2="740" y2="330" stroke="#C8963E" stroke-width="1.5"/>

  <!-- Display Sunglasses on Right Shelves -->
  <g stroke="#C8963E" stroke-width="2" fill="#112A30">
    <!-- Row 1 (Aviator) -->
    <path d="M 595 162 Q 610 160 622 165 Q 618 178 605 178 Z"/>
    <path d="M 632 165 Q 645 160 660 162 Q 652 178 638 178 Z"/>
    <line x1="622" y1="165" x2="632" y2="165"/>

    <path d="M 675 162 Q 690 160 702 165 Q 698 178 685 178 Z"/>
    <path d="M 712 165 Q 725 160 740 162 Q 732 178 718 178 Z"/>
    <line x1="702" y1="165" x2="712" y2="165"/>

    <!-- Row 2 (Wayfarer) -->
    <rect x="595" y="212" width="28" height="14" rx="3"/>
    <rect x="628" y="212" width="28" height="14" rx="3"/>
    <line x1="623" y1="216" x2="628" y2="216"/>

    <rect x="675" y="212" width="28" height="14" rx="3"/>
    <rect x="708" y="212" width="28" height="14" rx="3"/>
    <line x1="703" y1="216" x2="708" y2="216"/>
  </g>

  <!-- Center Snellen Vision Chart -->
  <rect x="335" y="125" width="130" height="155" rx="6" fill="#F4FAF9" stroke="#0E3B43" stroke-width="2"/>
  <text x="400" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#0E3B43" text-anchor="middle">E</text>
  <text x="400" y="178" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="4" fill="#0E3B43" text-anchor="middle">F P</text>
  <text x="400" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="5" fill="#0E3B43" text-anchor="middle">T O Z</text>
  <text x="400" y="220" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="4" fill="#0E3B43" text-anchor="middle">L P E D</text>
  <line x1="350" y1="235" x2="450" y2="235" stroke="#C62828" stroke-width="2"/>
  <line x1="350" y1="245" x2="450" y2="245" stroke="#1E7E34" stroke-width="2"/>

  <!-- Customer Consultation Counter -->
  <rect x="250" y="300" width="300" height="150" rx="12" fill="#0E2F37" stroke="#C8963E" stroke-width="2.5"/>
  <rect x="235" y="290" width="330" height="22" rx="6" fill="#1A4A54" stroke="#DFAD53" stroke-width="2"/>

  <!-- Countertop Rotating Brass Trial Mirror -->
  <ellipse cx="400" cy="235" rx="36" ry="46" fill="#E8F8F7" stroke="#C8963E" stroke-width="4"/>
  <path d="M 380 205 Q 410 215 425 255" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.6"/>
  <rect x="396" y="281" width="8" height="20" fill="#C8963E"/>
  <ellipse cx="400" cy="298" rx="24" ry="7" fill="#DFAD53"/>

  <!-- Center Reception Welcome Inscription -->
  <text x="400" y="350" font-family="'Noto Nastaliq Urdu', serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">خوش آمدید! طارق آپٹیکل سنٹر</text>
  <text x="400" y="380" font-family="'Noto Naskh Arabic', sans-serif" font-size="14" fill="#3BD4CF" text-anchor="middle">آنکھوں کی مکمل نگہداشت اور معیاری چشمہ سازی</text>
  <text x="400" y="415" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#DFAD53" text-anchor="middle">📞 0308-4454785  |  0319-4309408</text>
</svg>